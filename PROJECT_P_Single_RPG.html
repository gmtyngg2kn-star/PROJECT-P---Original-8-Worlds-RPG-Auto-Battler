<section class="panel fieldpanel" id="fieldPanel"><div class="story" id="story"></div><div id="dialogue" hidden><b id="speaker"></b><p id="dialogueText"></p><button id="dialogueNext">다음 대사 ▶</button></div><div class="field" id="field" aria-label="무림 필드"><div id="worldLayer"><canvas id="terrainCanvas" width="720" height="540"></canvas></div><div id="fieldActor"></div></div><div class="maptools"><span id="location"></span><button id="mapToggle">전체 지도</button></div><canvas id="minimap" width="180" height="120" aria-label="미니맵"></canvas><div id="fullMap" hidden><canvas id="bigmap" width="420" height="280"></canvas></div><div class="hint">조이스틱 이동 · 몬스터 주변 8칸 자동 전투 · NPC는 조사/대화</div><div class="joyrow"><div id="joystick" aria-label="이동 조이스틱"><div id="joyKnob"></div></div><span class="joyhint">스틱을 기울여 이동<br>손을 떼면 정지</span></div><div class="actions"><button id="talk">조사 / 대화</button><button id="heal">회복약 사용</button><button id="partyBtn">동료 / 편성</button></div></section>

<script>

"use strict";
const $=id=>document.getElementById(id),key=(x,y)=>x+","+y,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W=30,H=20,VW=12,VH=9,store="projectp_single_v03";
const heroes=[{id:"wanderer",name:"유랑검객",cloth:"#537bb3",hair:"#382c32"},{id:"blade",name:"청운검사",cloth:"#4c9c83",hair:"#5a3540"},{id:"shadow",name:"흑의무사",cloth:"#963e51",hair:"#272630"},{id:"sage",name:"백운도사",cloth:"#8561b0",hair:"#ddd5b7"}];
const initial=()=>({x:3,y:15,level:1,xp:0,gold:0,hp:60,potions:3,stage:0,chapter:1,defeated:[],journal:["무림 변방에 도착했다. 장로를 찾아가자."],roster:["wanderer"],party:["wanderer"],leader:"wanderer",visited:[]});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(store)||"null")||{});}catch{s=initial();}
if(!Array.isArray(s.roster))s.roster=["wanderer"];if(!Array.isArray(s.party))s.party=["wanderer"];if(!Array.isArray(s.visited))s.visited=[];
if(s.x<2||s.y<2||s.x>=W-1||s.y>=H-1){s.x=3;s.y=15;}
if(s.stage>=4&&!s.chapter)s.chapter=1;
let mode="field",combat=null,timer=null,speed=1,token=0,viewX=0,viewY=0;let posX=s.x,posY=s.y,lastFrame=0,animFrame=0,facing="down",lastMoveMessage="";
const npc={x:3,y:11},gate={x:26,y:3},secondNpc={x:17,y:8};
const mobs=[
{id:0,x:9,y:15,name:"수상한 복면인",hp:34,atk:6,chapter:1},
{id:1,x:17,y:15,name:"가짜 마교 무사",hp:48,atk:8,chapter:1},
{id:2,x:23,y:11,name:"복제된 무림 고수",hp:67,atk:10,chapter:1},
{id:3,x:22,y:6,name:"검은 전령",hp:72,atk:11,chapter:2},
{id:4,x:13,y:5,name:"복제된 청운검사",hp:84,atk:12,chapter:2},
{id:5,x:7,y:4,name:"그림자 지휘관",hp:105,atk:14,chapter:2}
];
const wall=new Set(),water=new Set(),trees=new Set();
for(let x=0;x<W;x++){wall.add(key(x,0));wall.add(key(x,H-1));}
for(let y=0;y<H;y++){wall.add(key(0,y));wall.add(key(W-1,y));}
for(let x=6;x<13;x++)for(let y=8;y<11;y++)if((x+y)%4===0)trees.add(key(x,y));
for(let x=14;x<21;x++)for(let y=9;y<13;y++)if((x+y)%3===0)trees.add(key(x,y));
for(let x=3;x<12;x++)if(x!==7)water.add(key(x,7));
for(let y=3;y<8;y++)water.add(key(12,y));
for(let x=19;x<25;x++)if(x!==22)wall.add(key(x,8));
const clearAround=(x,y)=>{for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){trees.delete(key(x+a,y+b));water.delete(key(x+a,y+b));wall.delete(key(x+a,y+b));}};
[npc,gate,secondNpc,...mobs,{x:3,y:15}].forEach(p=>clearAround(p.x,p.y));
function save(){localStorage.setItem(store,JSON.stringify(s));}
function note(t){s.journal.unshift(t);s.journal=s.journal.slice(0,7);save();}
function tell(t){$("story").textContent=t;}
function maxHp(){return 60+(s.level-1)*12;}
function htmlSafe(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function currentHero(){return heroes.find(h=>h.id===s.leader)||heroes[0];}
function questText(){return ["장로와 대화","복면인 추적","가짜 마교 무사","복제 고수","2장: 장로에게 보고","2장: 검은 전령","2장: 복제 검사","2장: 그림자 지휘관","2장 완료"][clamp(s.stage,0,8)];}
function stats(){$("level").textContent=currentHero().name+" Lv."+s.level+" · HP "+s.hp+"/"+maxHp();$("xp").textContent="경험치 "+s.xp+"/"+(s.level*25);$("gold").textContent="은전 "+s.gold;$("potions").textContent="회복약 "+s.potions;$("quest").textContent=questText();$("journal").innerHTML=s.journal.map(t=>"<p>"+htmlSafe(t)+"</p>").join("");}
function sprite(hero,cls=""){const e=document.createElement("span");e.className="pixelhero "+cls;e.style.setProperty("--cloth",hero.cloth);e.style.setProperty("--hair",hero.hair);e.innerHTML="<i></i><b class=\"belt\"></b><b class=\"sword\"></b>";return e;}
function visibleMob(m){return !s.defeated.includes(m.id)&&(m.chapter===1||s.stage>=5);}
function revealed(x,y){return s.visited.includes(key(x,y));}
function reveal(){const seen=new Set(s.visited);for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){let x=s.x+a,y=s.y+b;if(x>=0&&x<W&&y>=0&&y<H)seen.add(key(x,y));}s.visited=[...seen];}
function draw(){reveal();stats();renderField();$("location").textContent="무림 "+(s.stage>=5?"2장":"1장")+" · ("+s.x+","+s.y+")";mapDraw("minimap");if(!$("fullMap").hidden)mapDraw("bigmap");save();}
function terrainType(x,y){if(x<0||y<0||x>=W||y>=H||wall.has(key(x,y)))return "rock";if(water.has(key(x,y)))return "water";if(trees.has(key(x,y)))return "tree";return (x*17+y*23)%9<3?"grass":"path";}

function mapDraw(id){const c=$(id),ctx=c.getContext("2d"),mini=id==="minimap";ctx.fillStyle="#17232c";ctx.fillRect(0,0,c.width,c.height);const scale=mini?Math.min(c.width/13,c.height/7):Math.min(c.width/W,c.height/H);const ox=mini?c.width/2-(s.x+.5)*scale:0,oy=mini?c.height/2-(s.y+.5)*scale:0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=ox+x*scale,py=oy+y*scale;if(px+scale<0||py+scale<0||px>c.width||py>c.height||!revealed(x,y))continue;ctx.fillStyle=wall.has(key(x,y))?"#59676a":water.has(key(x,y))?"#376a93":trees.has(key(x,y))?"#336448":"#72856b";ctx.fillRect(px,py,Math.ceil(scale),Math.ceil(scale));}const dot=(x,y,color)=>{if(!revealed(x,y))return;ctx.fillStyle=color;ctx.fillRect(ox+(x+.2)*scale,oy+(y+.2)*scale,Math.max(3,scale*.6),Math.max(3,scale*.6));};dot(npc.x,npc.y,"#ffcf62");if(s.stage>=4)dot(secondNpc.x,secondNpc.y,"#ffcf62");dot(gate.x,gate.y,"#f2c85e");mobs.filter(visibleMob).forEach(m=>dot(m.x,m.y,"#ed655e"));dot(s.x,s.y,"#59b9ff");if(mini){ctx.strokeStyle="#f3f5e9";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(c.width/2,c.height/2,4,0,Math.PI*2);ctx.stroke();}else{ctx.strokeStyle="#f5e4a5";ctx.strokeRect(viewX*scale,viewY*scale,VW*scale,VH*scale);}}
function blocked(x,y){return x<=0||y<=0||x>=W-1||y>=H-1||wall.has(key(x,y))||water.has(key(x,y))||trees.has(key(x,y))||(x===npc.x&&y===npc.y)||(x===secondNpc.x&&y===secondNpc.y&&s.stage>=4)||(x===gate.x&&y===gate.y)||mobs.some(m=>m.x===x&&m.y===y&&visibleMob(m));}

function stepContinuous(dx,dy,dt){if(mode!=="field"||!dx&&!dy)return;const length=Math.hypot(dx,dy),vx=dx/length,vy=dy/length,dist=Math.min(dt,0.045)*3.6;const nextX=posX+vx*dist,nextY=posY+vy*dist;const safe=(x,y)=>{const margin=.24;for(const ax of [Math.floor(x-margin+.5),Math.floor(x+margin+.5)])for(const ay of [Math.floor(y-margin+.5),Math.floor(y+margin+.5)])if(blocked(ax,ay))return false;return true;};let changed=false;if(safe(nextX,posY)){posX=nextX;changed=true;}if(safe(posX,nextY)){posY=nextY;changed=true;}if(!changed)return;const nx=Math.round(posX),ny=Math.round(posY);if(nx!==s.x||ny!==s.y){s.x=nx;s.y=ny;reveal();save();detect();}if(mode==="field")renderField();}
