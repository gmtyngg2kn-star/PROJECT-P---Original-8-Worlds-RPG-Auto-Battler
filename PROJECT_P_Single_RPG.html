<script>

function terrainType(x,y){if(x<0||y<0||x>=W||y>=H||wall.has(key(x,y)))return "rock";if(water.has(key(x,y)))return "water";if(trees.has(key(x,y)))return "tree";return (x*17+y*23)%9<3?"grass":"path";}

const rand=(x*73+y*137+x*y*11)&255;if(t==="water"){ctx.strokeStyle="#81b1b8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+8,py+th*.48);ctx.quadraticCurveTo(px+tw*.4,py+th*.36,px+tw*.6,py+th*.5);ctx.stroke();}

// Fixed 200ms simulation steps: all units decide from the same board snapshot.
function tacticalTick(){

 const units=c.allies.concat(c.enemies).filter(v=>v.hp>0);
 const logs=[],effects=[],occupiedNow=new Set(units.map(v=>v.k));
 const fx=(u,type,cells)=>effects.push({actor:u.id,type,cells,until:c.elapsed+.55});
 // Opening charge resolves first, before other units move or attack.
 for(const u of units){
  if(u.side!=="ally"||u.skill!=="push"||u.used)continue;

   const next=u.k-6,blocker=units.find(v=>v!==u&&v.hp>0&&v.k===next);

  }

 }
 // Status timers run independently for every character.
 for(const u of units){
  if((u.stunTime||0)>0){u.stunTime=Math.max(0,u.stunTime-dt);u.stunnedThisStep=true;}
  else u.stunnedThisStep=false;
  u.attackClock=(u.attackClock||0)+dt;
  u.moveClock=(u.moveClock||0)+dt;
 }
 // Choose movement from the same board, then reserve destinations to prevent overlaps.
 const reserved=new Set(units.map(v=>v.k));
 const moves=[];
 for(const u of units){
  if(u.stunnedThisStep||u.moveClock<.52)continue;
  const foes=(u.side==="ally"?c.enemies:c.allies).filter(v=>v.hp>0);

 for(const u of units){

  const foes=(u.side==="ally"?c.enemies:c.allies).filter(v=>v.hp>0&&dist(u,v)<=range(u));

  let target=foes.slice().sort((a,b)=>a.hp-b.hp)[0],boost=1,crit=false,type=u.role==="mage"?"magic":"hit",label="";
  if(u.skill==="execute"){
   const low=foes.filter(v=>v.hp/v.max<=.25);
   if(low.length){target=low.sort((a,b)=>a.hp-b.hp)[0];boost=1.65;crit=true;type="shadow";label="암살";}
  }
  if(u.skill==="stealth"&&!u.used){u.used=true;boost=1.5;crit=true;type="shadow";label="은신 기습";}
  if(u.skill==="charge"&&!u.used){u.used=true;boost=1.35;label="돌파";}

   const group=foes.filter(v=>Math.abs(v.k%6-target.k%6)<=1&&Math.abs(Math.floor(v.k/6)-Math.floor(target.k/6))<=1);

  }
