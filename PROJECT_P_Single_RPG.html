<style>

<main><section class="panel"><div class="stats"><b id="level"></b><span id="xp"></span><span id="gold"></span><span id="potions"></span><span id="quest"></span></div></section>
<section class="panel fieldpanel" id="fieldPanel"><div class="story" id="story"></div><div class="field" id="field" aria-label="무림 필드"></div><div class="maptools"><span id="location"></span><button id="mapToggle">전체 지도</button></div><canvas id="minimap" width="210" height="115" aria-label="미니맵"></canvas><div id="fullMap" hidden><canvas id="bigmap" width="420" height="280"></canvas></div><div class="hint">방향키 이동 · 몬스터 주변 8칸 자동 전투 · NPC는 조사/대화</div><div class="controls"><span class="empty"></span><button data-dir="0,-1">▲</button><span class="empty"></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><div class="actions"><button id="talk">조사 / 대화</button><button id="heal">회복약 사용</button><button id="partyBtn">동료 / 편성</button></div></section>
<section class="panel battle" id="battle"><h3 id="battleTitle">전투</h3><div class="arena" id="arena"><div class="fighter" id="heroF"><div class="sprite"><span class="pixelhero" id="battleHero"></span></div><b id="heroName">유랑검객</b><div class="hp"><i id="heroBar"></i></div><small id="heroHP"></small></div><div class="fighter enemy" id="enemyF"><div class="sprite"><span class="pixelhero enemyhero" id="enemySprite"></span></div><b id="enemyName"></b><div class="hp"><i id="enemyBar"></i></div><small id="enemyHP"></small></div></div><p class="log" id="battleLog"></p><div class="actions"><button id="speed">전투 속도 ×1</button><button id="battleHeal">회복약 사용</button></div><p class="hint">전투는 자동으로 진행됩니다. 수동 조작은 추후 업데이트 예정.</p></section>
<section class="panel" id="partyPanel" hidden><b>영웅 편성 · 최대 4명</b><div id="partyList"></div><p class="hint">대표 영웅을 선택하면 필드 외형과 전투 캐릭터가 바뀝니다.</p></section><section class="panel"><b>모험 기록</b><div class="story" id="journal"></div></section></main><footer>PROJECT P · 싱글 RPG 시험판 · 기존 오토체스 v0.2와 별도 저장</footer>
<script>

"use strict";
const $=id=>document.getElementById(id),key=(x,y)=>x+","+y,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W=30,H=20,VW=12,VH=9,store="projectp_single_v03";
const heroes=[{id:"wanderer",name:"유랑검객",cloth:"#537bb3",hair:"#382c32"},{id:"blade",name:"청운검사",cloth:"#4c9c83",hair:"#5a3540"},{id:"shadow",name:"흑의무사",cloth:"#963e51",hair:"#272630"},{id:"sage",name:"백운도사",cloth:"#8561b0",hair:"#ddd5b7"}];
const initial=()=>({x:3,y:15,level:1,xp:0,gold:0,hp:60,potions:3,stage:0,chapter:1,defeated:[],journal:["무림 변방에 도착했다. 장로를 찾아가자."],roster:["wanderer"],party:["wanderer"],leader:"wanderer",visited:[]});
let s;try{s=Object.assign(initial(),JSON.parse(localStorage.getItem(store)||"null")||{});}catch{s=initial();}
if(!Array.isArray(s.roster))s.roster=["wanderer"];if(!Array.isArray(s.party))s.party=["wanderer"];if(!Array.isArray(s.visited))s.visited=[];
if(s.x<2||s.y<2||s.x>=W-1||s.y>=H-1){s.x=3;s.y=15;}
if(s.stage>=4&&!s.chapter)s.chapter=1;
let mode="field",combat=null,timer=null,speed=1,token=0,viewX=0,viewY=0;
const npc={x:3,y:11},gate={x:26,y:3},secondNpc={x:17,y:8};
const mobs=[
{id:0,x:9,y:15,name:"수상한 복면인",hp:34,atk:6,chapter:1},
{id:1,x:17,y:15,name:"가짜 마교 무사",hp:48,atk:8,chapter:1},
{id:2,x:23,y:11,name:"복제된 무림 고수",hp:67,atk:10,chapter:1},
{id:3,x:22,y:6,name:"검은 전령",hp:72,atk:11,chapter:2},
{id:4,x:13,y:5,name:"복제된 청운검사",hp:84,atk:12,chapter:2},
{id:5,x:7,y:4,name:"그림자 지휘관",hp:105,atk:14,chapter:2}
];
const wall=new Set(),water=new Set(),trees=new Set();
for(let x=0;x<W;x++){wall.add(key(x,0));wall.add(key(x,H-1));}
for(let y=0;y<H;y++){wall.add(key(0,y));wall.add(key(W-1,y));}
for(let x=6;x<13;x++)for(let y=8;y<11;y++)if((x+y)%4===0)trees.add(key(x,y));
for(let x=14;x<21;x++)for(let y=9;y<13;y++)if((x+y)%3===0)trees.add(key(x,y));
for(let x=3;x<12;x++)if(x!==7)water.add(key(x,7));
for(let y=3;y<8;y++)water.add(key(12,y));
for(let x=19;x<25;x++)if(x!==22)wall.add(key(x,8));
const clearAround=(x,y)=>{for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){trees.delete(key(x+a,y+b));water.delete(key(x+a,y+b));wall.delete(key(x+a,y+b));}};
[npc,gate,secondNpc,...mobs,{x:3,y:15}].forEach(p=>clearAround(p.x,p.y));
function save(){localStorage.setItem(store,JSON.stringify(s));}
function note(t){s.journal.unshift(t);s.journal=s.journal.slice(0,7);save();}
function tell(t){$("story").textContent=t;}
function maxHp(){return 60+(s.level-1)*12;}
function htmlSafe(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function currentHero(){return heroes.find(h=>h.id===s.leader)||heroes[0];}
function questText(){return ["장로와 대화","복면인 추적","가짜 마교 무사","복제 고수","2장: 장로에게 보고","2장: 검은 전령","2장: 복제 검사","2장: 그림자 지휘관","2장 완료"][clamp(s.stage,0,8)];}
function stats(){$("level").textContent=currentHero().name+" Lv."+s.level+" · HP "+s.hp+"/"+maxHp();$("xp").textContent="경험치 "+s.xp+"/"+(s.level*25);$("gold").textContent="은전 "+s.gold;$("potions").textContent="회복약 "+s.potions;$("quest").textContent=questText();$("journal").innerHTML=s.journal.map(t=>"<p>"+htmlSafe(t)+"</p>").join("");}
function sprite(hero,cls=""){const e=document.createElement("span");e.className="pixelhero "+cls;e.style.setProperty("--cloth",hero.cloth);e.style.setProperty("--hair",hero.hair);e.innerHTML="<i></i>";return e;}
function visibleMob(m){return !s.defeated.includes(m.id)&&(m.chapter===1||s.stage>=5);}
function revealed(x,y){return s.visited.includes(key(x,y));}
function reveal(){const seen=new Set(s.visited);for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){let x=s.x+a,y=s.y+b;if(x>=0&&x<W&&y>=0&&y<H)seen.add(key(x,y));}s.visited=[...seen];}
function draw(){reveal();stats();viewX=clamp(s.x-Math.floor(VW/2),0,W-VW);viewY=clamp(s.y-Math.floor(VH/2),0,H-VH);const f=$("field");f.replaceChildren();for(let y=viewY;y<viewY+VH;y++)for(let x=viewX;x<viewX+VW;x++){let el=document.createElement("div"),k=key(x,y),known=revealed(x,y);el.className="tile "+(!known?"fog":wall.has(k)?"rock":water.has(k)?"water":trees.has(k)?"tree":(x+y)%5===0?"grass":"path");if(known){if(x===s.x&&y===s.y)el.append(sprite(currentHero()));else if(x===npc.x&&y===npc.y)el.append(sprite({cloth:"#8c7653",hair:"#ddd5b7"},"mentor"));else if(x===secondNpc.x&&y===secondNpc.y&&s.stage>=4)el.append(sprite(heroes[1],"ally"));else if(x===gate.x&&y===gate.y)el.textContent="⛩";else{const m=mobs.find(m=>m.x===x&&m.y===y&&visibleMob(m));if(m)el.append(sprite({cloth:m.id===5?"#703a7c":"#963e51",hair:"#25202c"},"enemyhero"));else if(trees.has(k))el.textContent="🌲";else if(water.has(k))el.textContent="〰";else if(wall.has(k))el.textContent="⛰";}}f.append(el);} $("location").textContent="무림 "+(s.stage>=5?"2장":"1장")+" · ("+s.x+","+s.y+")";mapDraw("minimap");if(!$("fullMap").hidden)mapDraw("bigmap");save();}
function mapDraw(id){const c=$(id),ctx=c.getContext("2d"),cw=c.width/W,ch=c.height/H;ctx.fillStyle="#17232c";ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!revealed(x,y))continue;ctx.fillStyle=wall.has(key(x,y))?"#59676a":water.has(key(x,y))?"#376a93":trees.has(key(x,y))?"#336448":"#72856b";ctx.fillRect(x*cw,y*ch,Math.ceil(cw),Math.ceil(ch));}const dot=(x,y,color,r=1)=>{if(!revealed(x,y))return;ctx.fillStyle=color;ctx.fillRect((x-r/2)*cw,(y-r/2)*ch,Math.max(3,cw*r),Math.max(3,ch*r));};dot(npc.x,npc.y,"#ffcf62");if(s.stage>=4)dot(secondNpc.x,secondNpc.y,"#ffcf62");dot(gate.x,gate.y,"#f2c85e");mobs.filter(visibleMob).forEach(m=>dot(m.x,m.y,"#ed655e"));dot(s.x,s.y,"#59b9ff",1.4);if(id==="bigmap"){ctx.strokeStyle="#f5e4a5";ctx.strokeRect(viewX*cw,viewY*ch,VW*cw,VH*ch);}}
function blocked(x,y){return x<=0||y<=0||x>=W-1||y>=H-1||wall.has(key(x,y))||water.has(key(x,y))||trees.has(key(x,y))||(x===npc.x&&y===npc.y)||(x===secondNpc.x&&y===secondNpc.y)||(x===gate.x&&y===gate.y)||mobs.some(m=>m.x===x&&m.y===y&&visibleMob(m));}
function close8(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))<=1;}
function detect(){const near=mobs.filter(m=>visibleMob(m)&&close8(s,m));if(!near.length)return;near.sort((a,b)=>(Math.abs(a.x-s.x)+Math.abs(a.y-s.y))-(Math.abs(b.x-s.x)+Math.abs(b.y-s.y))||a.id-b.id);encounter(near[0]);}
function move(dx,dy){if(mode!=="field")return;const x=s.x+dx,y=s.y+dy;if(blocked(x,y)){tell("길이 막혀 있다. NPC와 대화하려면 조사 / 대화를 누르자.");return;}s.x=x;s.y=y;draw();tell("무림의 길을 탐험 중이다.");detect();}
function inspect(){for(const p of [npc,secondNpc,gate])if(close8(s,p)){interact(p);return;}tell("주변에 대화할 상대가 없다.");}
function interact(p){if(p===npc){if(s.stage===0){s.stage=1;note("장로: 마교를 사칭한 자들의 흔적을 찾아주게.");tell("장로: 동쪽 숲의 복면인부터 추적해 주게.");}else if(s.stage===4){s.stage=5;note("제2장 개막: 가짜 영웅을 조종하는 검은 전령을 추적한다.");tell("제2장 · 가면 뒤의 검. 장로: 북쪽으로 향하게. 청운검사가 단서를 알고 있을 게야.");}else tell(s.stage>=8?"장로: 무림은 잠시 평온을 되찾았지만, 이 사건은 시작일 뿐이네.":"장로: 무림의 혼란을 해결해 주게.");}
else if(p===secondNpc){if(s.stage>=4){if(!s.roster.includes("blade")){s.roster.push("blade");s.party.push("blade");note("청운검사가 동료로 합류했다!");}tell("청운검사: 나와 같은 얼굴의 검사가 나타났소. 함께 진상을 파헤칩시다.");}else tell("아직 이곳에 아무도 없다.");}
else if(p===gate)tell(s.stage>=8?"제2장 완료! 다음 세계로 향하는 길은 후속 업데이트에서 열린다.":"봉인된 산문이다. 무림의 사건을 해결해야 열린다.");draw();}
function potion(){if(s.potions<1){tell("회복약이 없다.");return false;}if(s.hp>=maxHp()){tell("체력이 가득하다.");return false;}s.potions--;s.hp=Math.min(maxHp(),s.hp+35);save();stats();tell("회복약을 사용했다. HP +35");return true;}
function encounter(m){if(mode!=="field")return;if(s.stage===0){tell("먼저 장로에게 이야기하자.");return;}if(m.id<3&&m.id>0&&!s.defeated.includes(m.id-1)){tell("앞선 적부터 조사하자.");return;}if(m.id>=3&&s.stage<5){tell("2장 사건이 시작되지 않았다.");return;}if(m.id>3&&!s.defeated.includes(m.id-1)){tell("검은 전령의 흔적부터 쫓아야 한다.");return;}mode="battle";combat={mob:m,ehp:m.hp,turn:0};$("fieldPanel").style.display="none";$("battle").classList.add("active");$("battleTitle").textContent=m.name+" 출현";$("heroName").textContent=currentHero().name;$("battleHero").style.setProperty("--cloth",currentHero().cloth);$("battleHero").style.setProperty("--hair",currentHero().hair);$("enemySprite").style.setProperty("--cloth",m.id===5?"#703a7c":"#963e51");$("enemyName").textContent=m.name;$("battleLog").textContent="전투 개시!";bars();schedule(550);}
function bars(){$("heroBar").style.width=100*s.hp/maxHp()+"%";$("enemyBar").style.width=100*Math.max(0,combat.ehp)/combat.mob.hp+"%";$("heroHP").textContent=s.hp+"/"+maxHp();$("enemyHP").textContent=Math.max(0,combat.ehp)+"/"+combat.mob.hp;stats();}
function schedule(ms){let t=token;clearTimeout(timer);timer=setTimeout(()=>{if(t===token)tick();},ms/speed);}
function effect(who,dmg,crit){const actor=$(who==="hero"?"heroF":"enemyF"),target=$(who==="hero"?"enemyF":"heroF"),arena=$("arena");actor.classList.add("attack");setTimeout(()=>{actor.classList.remove("attack");target.classList.add("hit");arena.classList.add("shake");},150/speed);setTimeout(()=>{target.classList.remove("hit");arena.classList.remove("shake");},380/speed);let slash=document.createElement("div");slash.className="slash";slash.style.left=who==="hero"?"60%":"24%";arena.append(slash);setTimeout(()=>slash.remove(),400);let f=document.createElement("div");f.className="float";f.textContent=(crit?"치명타 ":"")+"-"+dmg;f.style.left=who==="hero"?"72%":"28%";arena.append(f);setTimeout(()=>f.remove(),600);}
function tick(){if(mode!=="battle"||!combat)return;const m=combat.mob;if(combat.turn%2===0){const crit=Math.random()<.16,dmg=7+s.level*3+Math.floor(Math.random()*7)+(crit?9:0)+Math.max(0,s.party.length-1)*2;combat.ehp=Math.max(0,combat.ehp-dmg);effect("hero",dmg,crit);$("battleLog").textContent=currentHero().name+"의 "+(crit?"치명적인 검격! ":"검격! ")+dmg+" 피해";}else{const dmg=Math.max(1,m.atk+Math.floor(Math.random()*5)-Math.floor(s.level/2));s.hp=Math.max(0,s.hp-dmg);effect("enemy",dmg,false);$("battleLog").textContent=m.name+"의 공격! "+dmg+" 피해";}combat.turn++;bars();save();if(combat.ehp<=0){setTimeout(()=>finish(true),420/speed);return;}if(s.hp<=0){setTimeout(()=>finish(false),420/speed);return;}schedule(760);}
function finish(win){clearTimeout(timer);token++;const m=combat.mob;if(win){if(!s.defeated.includes(m.id))s.defeated.push(m.id);const gain=15+m.id*8;s.x=m.x;s.y=m.y;s.xp+=gain;s.gold+=8+m.id*5;while(s.xp>=s.level*25){s.xp-=s.level*25;s.level++;s.hp=maxHp();note("레벨 "+s.level+" 달성!");}s.stage=Math.max(s.stage,m.id+2);if(m.id===2){s.stage=4;note("제1장 완료. 장로에게 돌아가자.");tell("제1장 완료! 복제된 고수에게서 검은 문양이 발견됐다. 장로에게 보고하자.");}else if(m.id===5){s.stage=8;note("제2장 완료. 그림자 지휘관이 다른 세계의 문을 암시했다.");tell("제2장 완료! 그림자 지휘관: 이 무림은 여덟 세계 중 하나일 뿐이다…");}else tell("승리! "+m.name+"을 격파했다. 다음 단서를 찾자.");note(m.name+" 격파 · 경험치 +"+gain+" · 은전 획득.");if(m.id===3&&!s.roster.includes("shadow")){s.roster.push("shadow");note("흑의무사가 영웅 목록에 합류했다.");}if(m.id===4&&!s.roster.includes("sage")){s.roster.push("sage");note("백운도사가 영웅 목록에 합류했다.");}}
else{s.hp=maxHp();s.x=3;s.y=15;s.gold=Math.max(0,s.gold-5);note("전투 패배. 마을로 돌아왔다.");tell("전투에서 패배했다. 체력을 회복하고 마을에서 다시 시작한다.");}combat=null;mode="field";$("battle").classList.remove("active");$("fieldPanel").style.display="block";draw();}
function partyDraw(){const p=$("partyList");p.replaceChildren();for(const id of s.roster){const h=heroes.find(x=>x.id===id);if(!h)continue;const row=document.createElement("div");row.className="member";const name=document.createElement("span");name.textContent=h.name+(s.leader===id?" ★대표":"")+(s.party.includes(id)?" · 출전":"");row.append(name);const actions=document.createElement("span");const lead=document.createElement("button");lead.textContent="대표";lead.onclick=()=>{s.leader=id;if(!s.party.includes(id)){if(s.party.length>=4)s.party.pop();s.party.push(id);}save();partyDraw();draw();};actions.append(lead);const join=document.createElement("button");join.textContent=s.party.includes(id)?"제외":"편성";join.disabled=s.leader===id&&s.party.includes(id);join.onclick=()=>{if(s.party.includes(id))s.party=s.party.filter(x=>x!==id);else if(s.party.length<4)s.party.push(id);else{tell("출전 인원은 최대 4명이다.");return;}save();partyDraw();draw();};actions.append(join);row.append(actions);p.append(row);}}
document.querySelectorAll("[data-dir]").forEach(b=>{const go=()=>{const [dx,dy]=b.dataset.dir.split(",").map(Number);move(dx,dy);};b.addEventListener("touchstart",e=>{if(e.cancelable)e.preventDefault();go();},{passive:false});b.addEventListener("click",e=>{if(e.detail!==0&&window.matchMedia("(pointer:coarse)").matches)return;go();});});
document.addEventListener("touchstart",e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault();},{passive:false});document.addEventListener("touchmove",e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault();},{passive:false});document.addEventListener("dragstart",e=>e.preventDefault());document.addEventListener("selectstart",e=>{if(e.target.closest("main,header"))e.preventDefault();});document.addEventListener("contextmenu",e=>{if(e.target.closest("main,header"))e.preventDefault();});document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("keydown",e=>{const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(keys[e.key]){e.preventDefault();move(...keys[e.key]);}});
$("talk").onclick=inspect;$("heal").onclick=potion;$("battleHeal").onclick=()=>{if(mode==="battle"&&potion()){bars();$("battleLog").textContent="회복약 사용!";}};$("speed").onclick=()=>{speed=speed===1?2:1;$("speed").textContent="전투 속도 ×"+speed;};
$("partyBtn").onclick=()=>{$("partyPanel").hidden=!$("partyPanel").hidden;partyDraw();};$("mapToggle").onclick=()=>{$("fullMap").hidden=!$("fullMap").hidden;draw();};
$("reset").onclick=()=>{if(!confirm("싱글 RPG 진행 기록을 초기화할까요? 오토체스 저장은 유지됩니다."))return;clearTimeout(timer);token++;s=initial();combat=null;mode="field";$("battle").classList.remove("active");$("fieldPanel").style.display="block";save();draw();tell("무림 변방에 도착했다. 북쪽의 장로를 찾아가자.");};
draw();tell(s.stage===0?"무림 변방에 도착했다. 장로를 찾아가자.":s.stage===4?"1장 완료! 장로에게 보고하면 2장이 시작된다.":s.stage>=8?"2장 완료! 자유롭게 무림을 탐험하자.":"무림에서 복제 영웅의 흔적을 추적하자.");

</script></body></html>
