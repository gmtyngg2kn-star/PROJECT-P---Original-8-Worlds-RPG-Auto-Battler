<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT P | 여덟 세계</title><style>body{margin:0;background:#10141e;color:#e9e6dc;font-family:system-ui,sans-serif}header{padding:18px;background:#1b2230;border-bottom:2px solid #ad8c55}h1{margin:0;font-size:25px}small{color:#b8b7b0}.wrap{max-width:960px;margin:auto;padding:14px}.panel{background:#1b2330;border:1px solid #39445b;border-radius:12px;padding:14px;margin:12px 0}button{background:#33445a;color:white;border:1px solid #71829a;border-radius:7px;padding:10px;margin:3px;cursor:pointer}button:hover{background:#526784}button:disabled{opacity:.4}button.active{border-color:#f3c977;background:#655033}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.cell{height:68px;border:1px solid #536076;border-radius:7px;background:#293444;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:12px;cursor:pointer}.cell.enemy{background:#56323c}.cell.ally{background:#2e4d55}.cell.selected{outline:3px solid #f5ca6d}.cell b{font-size:20px}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{width:125px;min-height:106px;border:1px solid #5a6a7e;border-radius:8px;padding:8px;background:#263344;cursor:pointer}.card:hover{border-color:#f5ca6d}.card strong{display:block}.muted{color:#aeb8c8;font-size:12px}.stats{display:flex;gap:16px;flex-wrap:wrap}.log{max-height:150px;overflow:auto;font-size:13px;line-height:1.7}.bar{height:7px;background:#4d3034;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#6fc69b}.worlds{display:flex;flex-wrap:wrap;gap:5px}.world{font-size:12px;padding:6px;border-radius:5px;background:#303a4a}@media(max-width:550px){.cell{height:52px;font-size:10px}.cell b{font-size:15px}.card{width:40%;min-height:88px}}</style><header><h1>PROJECT P <small>— 여덟 세계의 균열</small></h1><small>싱글플레이 오토배틀 · 플레이 가능한 초기 프로토타입 v0.1</small></header><div class="wrap"><section class="panel"><b>프롤로그 · 무림세계</b><p id="story">죽은 고수의 무공이 다시 나타났다. 정파와 사파는 마교를 의심한다. 그러나 진짜 침입자는 다른 세계에서 왔다.</p><div class="worlds" id="worlds"></div></section><section class="panel"><div class="stats"><span>⚔️ 전투 <b id="round">1</b>/8</span><span>❤️ 결계 <b id="life">3</b></span><span>🪙 금화 <b id="gold">12</b></span><span>🏅 승리 <b id="wins">0</b></span></div><p class="muted">상점에서 영웅을 고른 뒤 아군 진영(아래 3줄)에 배치하세요. 같은 영웅 3명은 자동으로 승급합니다.</p><div class="grid" id="board"></div><p><button id="battle">전투 시작</button><button id="reroll">상점 새로고침 (2🪙)</button><button id="reset">처음부터</button></p><div id="synergy" class="muted"></div></section><section class="panel"><b>영웅 상점</b><div class="cards" id="shop"></div><p class="muted">대기 영웅: <span id="bench"></span> · 배치하려면 대기 영웅을 누른 후 빈 칸을 누르세요.</p></section><section class="panel"><b>전투 기록</b><div class="log" id="log"></div></section></div><script>
const worlds=['무림','검과 마법','인간 과학','기계','수인','초인','천사와 악마','신화'];
const heroes=[['독고천','무림','검객',5,12,40,'⚔️'],['백무진','무림','검객',4,10,34,'🗡️'],['매화린','무림','검객',2,6,22,'🌸'],['장무산','무림','수호',2,5,34,'🪓'],['제갈유현','무림','지원',2,4,22,'📜'],['아르벨','검과 마법','마도',3,9,23,'🧙'],['세리아','검과 마법','수호',2,5,32,'🛡️'],['윤서진','인간 과학','사격',2,7,20,'🔫'],['한도윤','인간 과학','지원',1,4,19,'🧪'],['AX-07','기계','수호',2,5,36,'🤖'],['제로','기계','사격',3,9,22,'🦾'],['라카','수인','검객',2,7,24,'🐺'],['미라','수인','지원',1,4,20,'🦊'],['강태성','초인','수호',3,7,32,'💥'],['이솔','초인','사격',2,8,19,'⚡'],['아자엘','천사와 악마','마도',4,11,25,'😈'],['엘리온','천사와 악마','지원',3,6,27,'👼'],['아테론','신화','수호',4,9,38,'🔱'],['니아','신화','마도',3,9,22,'🌙']];
let state;const $=id=>document.getElementById(id);function unit(i){return {i,lv:1,hp:heroes[i][5],uid:Math.random()}}function say(s){$('log').innerHTML='<div>• '+s+'</div>'+$('log').innerHTML}function init(){state={round:1,life:3,gold:12,wins:0,board:Array(36).fill(null),bench:[],shop:[],selected:null,ended:false};$('log').innerHTML='';roll(true);render();say('무림의 균열이 열렸다. 영웅을 모집하라.')}function roll(free=false){if(!free){if(state.gold<2)return say('금화가 부족하다.');state.gold-=2}state.shop=Array.from({length:5},()=>Math.floor(Math.random()*heroes.length));render()}function buy(slot){if(state.ended)return;let i=state.shop[slot];if(i===null)return;let h=heroes[i];if(state.gold<h[3])return say('금화가 부족하다.');if(state.bench.length>=9)return say('대기 공간이 가득 찼다.');state.gold-=h[3];state.bench.push(unit(i));state.shop[slot]=null;combine(i);render()}function combine(i){let all=[...state.bench.map((u,k)=>({u,k,bench:true})),...state.board.map((u,k)=>({u,k,bench:false}))].filter(x=>x.u&&x.u.i===i&&x.u.lv===1);if(all.length>=3){let selected=all.slice(0,3);selected.forEach(x=>{if(x.bench)state.bench[x.k]=null;else state.board[x.k]=null});state.bench=state.bench.filter(Boolean);let up=unit(i);up.lv=2;up.hp=Math.round(up.hp*1.9);state.bench.push(up);say(heroes[i][0]+' ★★ 승급!')}}function selectBench(k){state.selected=k;render()}function place(k){if(state.ended||state.round>8)return;if(k<18)return say('아군은 아래쪽 3줄에 배치해야 한다.');if(state.selected!==null){let u=state.bench[state.selected];if(!u)return;let old=state.board[k];state.board[k]=u;state.bench.splice(state.selected,1);if(old)state.bench.push(old);state.selected=null}else if(state.board[k]){state.bench.push(state.board[k]);state.board[k]=null}render()}function synergies(){let units=state.board.filter(Boolean), counts={};units.forEach(u=>{let w=heroes[u.i][1];counts[w]=(counts[w]||0)+1});return Object.entries(counts).filter(([w,n])=>n>=2).map(([w,n])=>w+' '+n+'명: 공격력 +'+(n>=4?6:3)).join(' · ')||'같은 세계 영웅 2명 이상 배치 시 공격력 보너스'}function render(){ $('round').textContent=Math.min(8,state.round);$('life').textContent=state.life;$('gold').textContent=state.gold;$('wins').textContent=state.wins;$('worlds').innerHTML=worlds.map((w,i)=>'<span class="world">'+(i+1)+'. '+w+'</span>').join('');$('board').innerHTML=state.board.map((u,k)=>{let e=k<18&&state.enemy?state.enemy[k]:null;let a=u||e;return '<div class="cell '+(e?'enemy':u?'ally':'')+'" data-k="'+k+'">'+(a?'<b>'+heroes[a.i][6]+'</b>'+heroes[a.i][0]+(a.lv>1?' ★★':''):'·')+'</div>'}).join('');document.querySelectorAll('.cell').forEach(el=>el.onclick=()=>place(+el.dataset.k));$('shop').innerHTML=state.shop.map((i,k)=>i===null?'<div class="card muted">판매 완료</div>':'<div class="card" data-shop="'+k+'"><strong>'+heroes[i][6]+' '+heroes[i][0]+'</strong><span class="muted">'+heroes[i][1]+' · '+heroes[i][2]+'</span><p>🪙 '+heroes[i][3]+' · ⚔️ '+heroes[i][4]+'</p></div>').join('');document.querySelectorAll('[data-shop]').forEach(el=>el.onclick=()=>buy(+el.dataset.shop));$('bench').innerHTML=state.bench.map((u,k)=>'<button class="'+(state.selected===k?'active':'')+'" data-b="'+k+'">'+heroes[u.i][6]+' '+heroes[u.i][0]+(u.lv===2?' ★★':'')+'</button>').join('')||'비어 있음';document.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>selectBench(+el.dataset.b));$('synergy').textContent='시너지: '+synergies();$('battle').disabled=state.ended||state.round>8;$('reroll').disabled=state.ended}
function fight(){if(state.ended)return;let team=state.board.filter(Boolean);if(!team.length)return say('영웅을 최소 1명 배치해야 한다.');let foeCount=Math.min(2+Math.floor(state.round/2),6);let enemies=Array.from({length:foeCount},(_,j)=>{let i=(state.round*3+j*5)%heroes.length;let u=unit(i);u.hp+=state.round*4;return u});state.enemy=Array(36).fill(null);enemies.forEach((u,j)=>state.enemy[1+j]=u);render();let copies=team.map(u=>({...u,hp:u.hp}));let count={};team.forEach(u=>{let w=heroes[u.i][1];count[w]=(count[w]||0)+1});let buff=Math.max(0,...Object.values(count).map(n=>n>=4?6:n>=2?3:0));let turn=0;while(copies.some(x=>x.hp>0)&&enemies.some(x=>x.hp>0)&&turn++<45){for(let u of copies.filter(x=>x.hp>0)){let t=enemies.find(x=>x.hp>0);if(!t)break;t.hp-=heroes[u.i][4]*u.lv+buff}for(let u of enemies.filter(x=>x.hp>0)){let t=copies.find(x=>x.hp>0);if(!t)break;t.hp-=Math.max(2,heroes[u.i][4]-2)+Math.floor(state.round/3)}}let win=copies.some(x=>x.hp>0)&&!enemies.some(x=>x.hp>0);state.enemy=null;if(win){state.wins++;state.gold+=5+state.round;say('제'+state.round+'전 승리! 금화 '+(5+state.round)+' 획득.')}else{state.life--;state.gold+=3;say('제'+state.round+'전 패배. 결계 1 감소. 금화 3 획득.')}if(state.life<=0){state.ended=true;$('story').textContent='결계가 무너졌다. 다른 세계의 복제체가 무림에 밀려든다. 다시 도전하라.';say('패배 — 다시 시작할 수 있다.')}else if(state.round===8){state.ended=true;$('story').textContent='천마가 자신과 똑같은 검객을 마주했다. “크하하하! 천하에 나와 같은 놈이 또 있다니!” 검과 검이 부딪치기 직전, 화면이 어두워진다. [다음 세계는 후속 개발 예정]';say('무림편 프롤로그 완료! 현재 버전의 마지막 장면.')}else{state.round++;roll(true);$('story').textContent=state.round>=6?'정사 연합군이 천마산으로 진격한다. 전장에 죽은 자들의 모습이 나타난다.':'의문의 습격이 이어진다. 영웅들이 서로 다른 이유로 모이기 시작한다.'}render()}
$('battle').onclick=fight;$('reroll').onclick=()=>roll();$('reset').onclick=init;init();
</script></html>
